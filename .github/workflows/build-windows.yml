name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sources (quality gate)
        run: |
          Get-ChildItem renderer/js/*.js, main/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
          $pkg = Get-Content package.json | ConvertFrom-Json
          $hit = Select-String -Path renderer/js/app.js -Pattern ([regex]::Escape($pkg.version))
          if (-not $hit) { Write-Error "About dialog not in sync with package.json version $($pkg.version)"; exit 1 }
          Write-Host "quality gate passed: version $($pkg.version) consistent" 

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApolloCut-Windows-Installer
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 90

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
